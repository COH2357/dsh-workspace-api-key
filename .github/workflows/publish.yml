name: publish

# Trusted publishing (OIDC): no long-lived npm token is stored in this repository.
# The npm package must list this repository and this workflow file as a trusted
# publisher before a run can publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # The test suite pins Windows-style paths (C:\work\...), so run it where
    # those assertions are meaningful.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "tag v$tag does not match package.json version $pkg"
          }
          Write-Host "publishing version $pkg"

      - name: Publish to npm
        run: npm publish --access public --provenance
